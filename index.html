<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>راز</title>
<script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0b141a;--panel:#111b21;--panel2:#202c33;--panel3:#2a3942;--text:#e9edef;--dim:#8696a0;--green:#00a884;--green2:#06cf9c;--me:#005c4b;--other:#202c33;--border:#222d34}
body{font-family:Tahoma,Arial,sans-serif;background:#0b141a;color:var(--text);height:100vh;overflow:hidden;font-size:14px}
#app{height:100vh;max-width:520px;margin:0 auto;background:var(--panel);position:relative;display:flex;flex-direction:column;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--panel);z-index:5}
.screen.hidden{display:none}
#login{background:linear-gradient(135deg,#0b141a,#111b21);z-index:100;justify-content:center;align-items:center;padding:24px;gap:14px}
#login .logo{font-size:70px;margin-bottom:6px}
#login h1{font-size:28px;background:linear-gradient(90deg,#6678ff,#20d9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#login .sub{color:var(--dim);font-size:13px;margin-bottom:18px;text-align:center}
#login input{width:100%;max-width:320px;padding:14px;border-radius:10px;border:none;background:var(--panel3);color:var(--text);font-size:15px;outline:none;text-align:center;font-family:inherit}
#login button{width:100%;max-width:320px;padding:14px;border-radius:10px;border:none;background:var(--green);color:#fff;font-size:16px;cursor:pointer;font-weight:bold;font-family:inherit}
#login button:disabled{opacity:.5}
#loginStatus{margin-top:10px;font-size:12px;color:var(--dim);min-height:20px;text-align:center;max-width:320px;line-height:1.6}
.hdr{background:var(--panel2);padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:2;flex-shrink:0;min-height:60px}
.hdr .back{background:none;border:none;color:#aebac1;font-size:22px;cursor:pointer;padding:4px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.hdr .back:hover{background:var(--panel3)}
.hdr .title{flex:1;font-weight:bold;font-size:16px;min-width:0}
.hdr .title .sub{font-size:11px;color:var(--dim);font-weight:normal;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .title .sub.on{color:var(--green2)}
.hdr .icon{background:none;border:none;color:#aebac1;font-size:19px;cursor:pointer;padding:6px;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hdr .icon:hover{background:var(--panel3)}
.hdr .avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:16px;color:#fff;flex-shrink:0;overflow:hidden}
#chatList{flex:1;overflow-y:auto;background:var(--panel)}
#chatList::-webkit-scrollbar{width:5px}
#chatList::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:3px}
.chat-item{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;border-bottom:1px solid #1a252c;transition:background .1s}
.chat-item:hover{background:var(--panel2)}
.chat-item .av{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:19px;color:#fff;flex-shrink:0;position:relative;background:var(--green)}
.chat-item .av .dot{position:absolute;bottom:1px;left:1px;width:12px;height:12px;background:var(--green2);border-radius:50%;border:2px solid var(--panel)}
.chat-item .info{flex:1;min-width:0}
.chat-item .row1{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:3px}
.chat-item .nm{font-weight:bold;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item .tm{font-size:11px;color:var(--dim);flex-shrink:0}
.chat-item .row2{display:flex;justify-content:space-between;align-items:center;gap:6px}
.chat-item .pv{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.chat-item .badge{background:var(--green);color:#fff;font-size:11px;font-weight:bold;border-radius:10px;padding:2px 7px;min-width:20px;text-align:center;flex-shrink:0}
.empty{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:60px 24px;text-align:center;color:var(--dim)}
.empty .em{font-size:60px;margin-bottom:16px;opacity:.5}
.empty p{font-size:14px;line-height:1.6}
.fabs{position:absolute;bottom:20px;left:20px;display:flex;flex-direction:column;gap:10px;z-index:4}
.fab{width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;font-size:24px;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
.fab:hover{background:var(--green2)}
.fab.group{background:#7c3aed}
#messages{flex:1;overflow-y:auto;padding:16px 5%;background:var(--bg);display:flex;flex-direction:column;gap:2px}
#messages::-webkit-scrollbar{width:5px}
#messages::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:3px}
.msg{max-width:78%;padding:7px 11px 5px;border-radius:9px;font-size:14.5px;line-height:1.4;word-wrap:break-word;position:relative;animation:pop .15s}
@keyframes pop{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.msg.me{align-self:flex-start;background:var(--me);border-top-left-radius:2px}
.msg.other{align-self:flex-end;background:var(--other);border-top-right-radius:2px}
.msg .from{font-size:12px;font-weight:bold;margin-bottom:3px}
.msg.me .from{color:#06cf9c}
.msg.other .from{color:#53bdeb}
.msg .body{word-break:break-word;white-space:pre-wrap}
.msg .meta{font-size:10px;color:var(--dim);margin-top:3px;text-align:left}
.msg .photo{max-width:100%;max-height:340px;border-radius:6px;display:block;cursor:pointer;margin-top:3px;object-fit:cover}
.voiceBox{display:flex;align-items:center;gap:10px;min-width:200px}
.voiceBox .play{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.3);border:none;color:#fff;font-size:14px;cursor:pointer;flex-shrink:0}
.voiceBox.playing .play{background:var(--green)}
.voiceBox .bars{flex:1;height:22px;display:flex;align-items:center;gap:2px}
.voiceBox .bars span{width:3px;background:var(--dim);border-radius:2px}
.voiceBox .dur{font-size:11px;color:var(--dim);min-width:32px;text-align:left}
.sys{align-self:center;background:#182229;color:var(--dim);font-size:12px;padding:5px 12px;border-radius:8px;margin:6px 0;max-width:85%;text-align:center}
.dayDiv{align-self:center;background:#182229;color:var(--dim);font-size:11px;padding:4px 12px;border-radius:6px;margin:8px 0}
#typingBar{background:var(--bg);color:var(--green2);font-size:12px;padding:0 20px;min-height:0;flex-shrink:0}
#typingBar.on{min-height:22px;padding:5px 20px}
#inputBar{background:var(--panel2);padding:8px 10px;display:flex;gap:6px;align-items:center;flex-shrink:0}
#inputBar button{width:42px;height:42px;border-radius:50%;border:none;background:transparent;color:#aebac1;font-size:19px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#inputBar button:hover{background:var(--panel3)}
#inputBar button.send{background:var(--green);color:#fff}
#inputBar button.mic{background:var(--green);color:#fff}
#inputBar button.mic.rec{background:#ff4444;animation:pulse 1s infinite}
#inputBar input[type=text]{flex:1;padding:12px 16px;border-radius:22px;border:none;background:var(--panel3);color:var(--text);font-size:15px;outline:none;font-family:inherit;min-width:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
#recBar{display:none;align-items:center;gap:10px;padding:10px 14px;background:#5c1e1e;color:#fff;flex-shrink:0}
#recBar.on{display:flex}
#recBar .dot{width:10px;height:10px;background:#ff4444;border-radius:50%;animation:pulse 1s infinite}
#recBar .t{font-weight:bold;font-variant-numeric:tabular-nums;min-width:52px}
#recBar .hint{flex:1;font-size:11px;opacity:.85}
#recBar button{border:none;background:rgba(255,255,255,.15);color:#fff;width:38px;height:38px;border-radius:50%;font-size:15px;cursor:pointer;flex-shrink:0}
#recBar button.send{background:var(--green)}
#uploading{display:none;align-items:center;gap:10px;padding:10px 14px;background:#1e3a5c;color:#fff;flex-shrink:0}
#uploading.on{display:flex}
#uploading .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;justify-content:center;align-items:center;z-index:200;padding:20px}
.modal.on{display:flex}
.modalBox{background:var(--panel);border-radius:14px;width:100%;max-width:420px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
.modalHdr{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.modalHdr h2{font-size:16px}
.modalHdr button{background:none;border:none;color:#aebac1;font-size:22px;cursor:pointer;padding:4px;line-height:1}
.modalBody{flex:1;overflow-y:auto;padding:14px 18px}
.modalBody .lbl{font-size:12px;color:var(--dim);margin-bottom:6px;display:block;margin-top:8px}
.modalBody input[type=text]{width:100%;padding:12px 14px;border-radius:8px;border:none;background:var(--panel3);color:var(--text);font-size:14px;outline:none;font-family:inherit;margin-bottom:12px}
.modalBody .hint{font-size:11px;color:var(--dim);margin-bottom:14px;line-height:1.6}
.contact-row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;cursor:pointer}
.contact-row:hover{background:var(--panel2)}
.contact-row input{width:20px;height:20px;accent-color:var(--green);cursor:pointer;flex-shrink:0}
.contact-row .av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:15px;color:#fff;flex-shrink:0}
.contact-row .nm{font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact-row .uid{font-size:11px;color:var(--dim);margin-top:2px}
.modalFtr{padding:12px 18px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--border)}
.modalFtr button{padding:10px 20px;border-radius:8px;border:none;font-size:14px;font-weight:bold;cursor:pointer;font-family:inherit}
.modalFtr .cancel{background:var(--panel3);color:var(--text)}
.modalFtr .ok{background:var(--green);color:#fff}
.modalFtr .ok:disabled{opacity:.4}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;justify-content:center;align-items:center;z-index:300;cursor:zoom-out;padding:20px}
#lightbox.on{display:flex}
#lightbox img{max-width:100%;max-height:100%;object-fit:contain}
#emojiPanel{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--panel2);border-radius:12px;padding:8px;display:none;grid-template-columns:repeat(8,1fr);gap:2px;max-width:340px;max-height:240px;overflow-y:auto;box-shadow:0 4px 20px rgba(0,0,0,.6);z-index:20}
#emojiPanel.on{display:grid}
#emojiPanel span{font-size:20px;cursor:pointer;padding:4px;border-radius:6px;text-align:center;user-select:none}
#emojiPanel span:hover{background:var(--panel3)}

/* ============ Image Menu (Bottom Sheet) ============ */
#imageMenu{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:400;justify-content:center;align-items:flex-end}
#imageMenu.on{display:flex}
#imageMenu .sheet{background:var(--panel2);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px;display:flex;flex-direction:column;gap:10px;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
#imageMenu .sheetTitle{font-weight:bold;text-align:center;color:var(--text);margin-bottom:10px;font-size:15px}
#imageMenu button{padding:16px;border-radius:12px;border:none;background:var(--panel3);color:var(--text);font-size:15px;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:12px;justify-content:center;transition:.15s}
#imageMenu button:hover{background:#374248}
#imageMenu button.cancel{background:#5c1e1e;color:#fff;padding:14px}
</style>
</head>
<body>

<div id="app">

<div class="screen" id="login">
  <div class="logo">🔒</div>
  <h1>راز</h1>
  <div class="sub">پیام‌رسان امن و سریع</div>
  <input id="nameInp" placeholder="اسم شما..." maxlength="25" autocomplete="off">
  <button id="joinBtn">ورود</button>
  <div id="loginStatus">آماده</div>
</div>

<div class="screen hidden" id="mainScreen">
  <div class="hdr">
    <div class="avatar" id="myAvatarHeader" style="background:var(--green)">؟</div>
    <div class="title">راز<div class="sub" id="myIdSub">-</div></div>
    <button class="icon" id="settingsBtn" title="تنظیمات">⚙️</button>
  </div>
  <div id="chatList"></div>
  <div class="fabs">
    <button class="fab group" id="newGroupFab" title="گروه جدید">👥</button>
    <button class="fab" id="newContactFab" title="مخاطب جدید">➕</button>
  </div>
</div>

<div class="screen hidden" id="chatScreen">
  <div class="hdr">
    <button class="back" id="chatBack">←</button>
    <div class="avatar" id="chatAvatar" style="background:var(--green)">؟</div>
    <div class="title">-<div class="sub" id="chatSub">-</div></div>
    <button class="icon" id="chatInfoBtn" title="اطلاعات">ℹ️</button>
  </div>
  <div id="messages"></div>
  <div id="typingBar"></div>
  <div id="recBar">
    <div class="dot"></div>
    <div class="t" id="recTime">00:00</div>
    <div class="hint">حداکثر ۱۵ ثانیه</div>
    <button id="cancelRec">✕</button>
    <button class="send" id="sendRec">➤</button>
  </div>
  <div id="uploading">
    <div class="spinner"></div>
    <div>در حال آماده‌سازی عکس...</div>
  </div>
  <form id="inputBar" autocomplete="off">
    <button type="button" id="emojiBtn">😊</button>
    <button type="button" id="attachBtn">📎</button>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
    <input type="text" id="msgInp" placeholder="پیام...">
    <button type="button" id="micBtn" class="mic">🎤</button>
    <button type="button" id="sendBtn" class="send" style="display:none">➤</button>
  </form>
</div>

</div>

<!-- ============ Image Menu ============ -->
<div id="imageMenu">
  <div class="sheet">
    <div class="sheetTitle">📷 ارسال عکس</div>
    <button id="pickGallery">🖼️ انتخاب از گالری</button>
    <button id="pickCamera">📷 گرفتن با دوربین</button>
    <button id="cancelImageMenu" class="cancel">لغو</button>
  </div>
</div>

<div class="modal" id="newContactModal">
  <div class="modalBox">
    <div class="modalHdr"><h2>➕ مخاطب جدید</h2><button data-close="newContactModal">✕</button></div>
    <div class="modalBody">
      <label class="lbl">ID کاربر مورد نظر:</label>
      <input type="text" id="contactIdInp" placeholder="u12345678" autocomplete="off" dir="ltr" style="text-align:left">
      <div class="hint">ID رو از خود شخص بگیر (توی هدر اپش می‌بینه).</div>
      <label class="lbl">اسم دلخواه:</label>
      <input type="text" id="contactNameInp" placeholder="مثلاً: علی" autocomplete="off">
    </div>
    <div class="modalFtr">
      <button class="cancel" data-close="newContactModal">لغو</button>
      <button class="ok" id="addContactOk">افزودن</button>
    </div>
  </div>
</div>

<div class="modal" id="newGroupModal">
  <div class="modalBox">
    <div class="modalHdr"><h2>👥 گروه جدید</h2><button data-close="newGroupModal">✕</button></div>
    <div class="modalBody">
      <label class="lbl">اسم گروه:</label>
      <input type="text" id="groupNameInp" placeholder="مثلاً: دوستان" autocomplete="off">
      <label class="lbl">اعضا:</label>
      <div id="contactPickList"></div>
    </div>
    <div class="modalFtr">
      <button class="cancel" data-close="newGroupModal">لغو</button>
      <button class="ok" id="createGroupOk" disabled>ساخت گروه</button>
    </div>
  </div>
</div>

<div class="modal" id="profileModal">
  <div class="modalBox">
    <div class="modalHdr"><h2>👤 پروفایل</h2><button data-close="profileModal">✕</button></div>
    <div class="modalBody">
      <label class="lbl">اسم:</label>
      <input type="text" id="profileNameInp" autocomplete="off">
      <label class="lbl">ID من:</label>
      <input type="text" id="profileIdInp" readonly dir="ltr" style="text-align:left;cursor:text">
      <div class="hint">با کلیک کپی می‌شه</div>
      <button id="logoutBtn" style="padding:10px;border-radius:8px;border:none;background:#5c1e1e;color:#fff;cursor:pointer;font-family:inherit;font-size:13px;width:100%;margin-top:8px">خروج</button>
    </div>
    <div class="modalFtr">
      <button class="cancel" data-close="profileModal">بستن</button>
      <button class="ok" id="saveProfileOk">ذخیره</button>
    </div>
  </div>
</div>

<div id="lightbox"><img id="lightboxImg"></div>
<div id="emojiPanel"></div>

<script>
// ========================================================
//      راز — پیام‌رسان (متن + ویس + عکس + گالری/دوربین)
// ========================================================

const $ = id => document.getElementById(id);
const PREFIX = 'raaz_msgr_v2';

const BROKERS = [
  'wss://broker.hivemq.com:8884/mqtt',
  'wss://broker.emqx.io:8084/mqtt',
  'wss://mqtt.eclipseprojects.io:443/mqtt',
  'wss://test.mosquitto.org:8081/mqtt',
];

const MAX_VOICE_SIZE = 200 * 1024;
const MAX_VOICE_DURATION = 15;
const MAX_IMAGE_SIZE = 150 * 1024;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtT = t => new Date(t).toLocaleTimeString('fa-IR', {hour:'2-digit',minute:'2-digit'});
const fmtDur = s => String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
const fmtDay = t => {
  const d = new Date(t), n = new Date(), y = new Date(); y.setDate(y.getDate()-1);
  if (d.toDateString() === n.toDateString()) return 'امروز';
  if (d.toDateString() === y.toDateString()) return 'دیروز';
  return d.toLocaleDateString('fa-IR', {year:'numeric',month:'long',day:'numeric'});
};
const colorOf = str => {
  let h=0; for(let i=0;i<str.length;i++) h = str.charCodeAt(i) + ((h<<5)-h);
  return `hsl(${Math.abs(h)%360},55%,45%)`;
};
const beep = () => {
  try {
    const c = new (window.AudioContext||window.webkitAudioContext)();
    const o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.frequency.value = 800; o.type = 'sine';
    g.gain.setValueAtTime(.1, c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .15);
    o.start(); o.stop(c.currentTime + .15);
  } catch(e){}
};

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function base64ToBlob(base64, mime) {
  const byteChars = atob(base64);
  const byteNumbers = new Array(byteChars.length);
  for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
  const byteArray = new Uint8Array(byteNumbers);
  return new Blob([byteArray], { type: mime || 'application/octet-stream' });
}

function compressImage(file, maxWidth, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        canvas.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), 'image/jpeg', quality);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ============ MQTT ============
async function connectMQTT() {
  let lastErr = null;
  for (let i = 0; i < BROKERS.length; i++) {
    const url = BROKERS[i];
    try {
      console.log(`🔄 تلاش ${i+1}/${BROKERS.length}: ${url}`);
      const c = await tryConnect(url);
      state.mqttBroker = url;
      return c;
    } catch(e) {
      lastErr = e;
      console.warn(`❌ ${url} — ${e.message}`);
    }
  }
  throw lastErr || new Error('هیچ بروکری پاسخ نداد');
}

function tryConnect(url) {
  return new Promise((res, rej) => {
    let done = false;
    let c;
    try {
      c = mqtt.connect(url, {
        clientId: 'raaz_' + state.myId + '_' + uid(),
        clean: true,
        connectTimeout: 6000,
        reconnectPeriod: 0,
      });
    } catch(e) { return rej(e); }

    const to = setTimeout(() => {
      if (!done) { done = true; try { c.end(true); } catch(_) {} rej(new Error('timeout')); }
    }, 7000);

    c.on('connect', () => {
      if (done) return;
      done = true;
      clearTimeout(to);
      state.mqtt = c;

      c.subscribe([
        `${PREFIX}/msg/${state.myId}`,
        `${PREFIX}/presence/+`,
        `${PREFIX}/typing/${state.myId}`,
      ], err => {
        if (err) console.error('sub err', err);
        else console.log('📥 subscribe ok');
      });

      c.on('message', onMQTT);

      announcePresence();
      setInterval(announcePresence, 5000);
      setInterval(checkPresence, 3000);

      res(c);
    });

    c.on('error', (e) => {
      if (done) return;
      done = true;
      clearTimeout(to);
      try { c.end(true); } catch(_) {}
      rej(e);
    });

    c.on('close', () => {
      if (done) return;
      done = true;
      clearTimeout(to);
      rej(new Error('closed'));
    });
  });
}

function announcePresence() {
  if (!state.mqtt || !state.mqtt.connected) return;
  state.mqtt.publish(`${PREFIX}/presence/${state.myId}`,
    JSON.stringify({ user: state.myName, time: Date.now() }));
}

function checkPresence() {
  const now = Date.now();
  let changed = false;
  for (const u in state.presence) {
    if (now - state.presence[u] > 15000) { delete state.presence[u]; changed = true; }
  }
  for (const u in state.typing) {
    if (now - state.typing[u] > 4000) { delete state.typing[u]; changed = true; }
  }
  if (changed) { renderChatList(); updateHeaderPresence(); updateTypingBar(); }
}

function onMQTT(topic, payload) {
  let d;
  try { d = JSON.parse(payload.toString()); } catch(e) { return; }

  if (topic.startsWith(`${PREFIX}/presence/`)) {
    const u = topic.slice(`${PREFIX}/presence/`.length);
    if (u === state.myId) return;
    if (d.left) delete state.presence[u];
    else state.presence[u] = Date.now();
    renderChatList();
    updateHeaderPresence();
    return;
  }

  if (topic === `${PREFIX}/typing/${state.myId}`) {
    if (!d.fromId) return;
    if (d.typing) state.typing[d.fromId] = Date.now();
    else delete state.typing[d.fromId];
    updateTypingBar();
    return;
  }

  if (topic === `${PREFIX}/msg/${state.myId}`) {
    handleIncoming(d);
    return;
  }
}

// ============ Incoming ============
function handleIncoming(d) {
  if (!d || d.fromId === state.myId) return;

  if (d.type === 'invite') {
    if (state.groups[d.groupId]) return;
    state.groups[d.groupId] = { name: d.groupName, members: d.members, createdAt: Date.now() };
    if (!state.contacts[d.fromId]) state.contacts[d.fromId] = { name: d.from };
    save();
    renderChatList();
    alert(`به گروه «${d.groupName}» اضافه شدی!`);
    return;
  }

  if (!d.groupId && !state.contacts[d.fromId]) {
    state.contacts[d.fromId] = { name: d.from };
    save();
  }

  const chatId = d.groupId ? 'group_' + d.groupId : 'dm_' + d.fromId;
  if (!state.messages[chatId]) state.messages[chatId] = [];
  if (state.messages[chatId].some(m => m.id === d.id)) return;

  if (d.type === 'voice' && d.audioBase64) {
    try {
      const blob = base64ToBlob(d.audioBase64, d.mime || 'audio/webm');
      state.fileStore[d.fileId] = { blob, name: 'voice.webm', size: blob.size, mime: d.mime || 'audio/webm', duration: d.duration || 0 };
      console.log('🎤 ویس دریافتی:', blob.size, 'بایت');
    } catch(e) { console.error('voice error', e); }
  }

  if (d.type === 'image' && d.imageBase64) {
    try {
      const blob = base64ToBlob(d.imageBase64, d.mime || 'image/jpeg');
      state.fileStore[d.fileId] = { blob, name: 'image.jpg', size: blob.size, mime: d.mime || 'image/jpeg' };
      console.log('📷 عکس دریافتی:', blob.size, 'بایت');
    } catch(e) { console.error('image error', e); }
  }

  state.messages[chatId].push(d);

  if (state.currentChat && state.currentChat.id === chatId) {
    appendMessage(d, false);
  } else {
    state.unread[chatId] = (state.unread[chatId] || 0) + 1;
  }
  save();
  beep();
  renderChatList();

  if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
    const body = d.type === 'voice' ? '🎤 پیام صوتی' : d.type === 'image' ? '📷 عکس' : (d.text || 'پیام جدید');
    new Notification(d.from, { body });
  }
}

function renderMessages() {
  const box = $('messages');

    const d = document.createElement('div');

      dd.textContent = fmtDay(m.time);

      lastDay = day;

function appendMessage(m, isMine) {
  const box = $('messages');
  const d = document.createElement('div');
  d.className = 'msg ' + (isMine ? 'me' : 'other');

  let inner = '';
  if (!isMine && state.currentChat && state.currentChat.type === 'group') {
    inner += `<div class="from" style="color:${colorOf(m.from)}">${esc(m.from)}</div>`;
  }

  if (m.type === 'voice') {
    if (m.audioBase64 && !state.fileStore[m.fileId]) {
      try {
        const blob = base64ToBlob(m.audioBase64, m.mime || 'audio/webm');
        state.fileStore[m.fileId] = { blob, name: 'voice.webm', size: blob.size, mime: m.mime || 'audio/webm', duration: m.duration || 0 };
      } catch(e) { console.error(e); }
    }

    const hasFile = !!state.fileStore[m.fileId];
    const dur = fmtDur(m.duration || 0);
    const bars = Array.from({length: 18}, () => `<span style="height:${4 + Math.random()*16}px"></span>`).join('');

    if (hasFile) {
      inner += `<div class="voiceBox" data-fid="${m.fileId}">
        <button class="play" type="button">▶</button>
        <div class="bars">${bars}</div>
        <div class="dur">${dur}</div>
      </div>`;
    } else {
      inner += `<div style="padding:8px;color:#8696a0;font-size:12px">🎤 پیام صوتی (در حال دریافت...)</div>`;
    }
  } else if (m.type === 'image') {
    if (m.imageBase64 && !state.fileStore[m.fileId]) {
      try {
        const blob = base64ToBlob(m.imageBase64, m.mime || 'image/jpeg');
        state.fileStore[m.fileId] = { blob, name: 'image.jpg', size: blob.size, mime: m.mime || 'image/jpeg' };
      } catch(e) { console.error(e); }
    }

    const fs = state.fileStore[m.fileId];
    if (fs) {
      const url = URL.createObjectURL(fs.blob);
      inner += `<img class="photo" src="${url}" data-fid="${m.fileId}">`;
    } else {
      inner += `<div style="padding:8px;color:#8696a0;font-size:12px">📷 عکس (در حال دریافت...)</div>`;
    }
  } else {
    inner += `<div class="body">${esc(m.text || '')}</div>`;
  }

  inner += `<div class="meta">${fmtT(m.time)}</div>`;
  d.innerHTML = inner;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;

  d.querySelectorAll('.voiceBox').forEach(vb => {
    vb.querySelector('.play').onclick = () => playVoice(m.fileId, vb);
  });
  d.querySelectorAll('img.photo').forEach(img => {
    img.onclick = () => {
      $('lightboxImg').src = img.src;
      $('lightbox').classList.add('on');
    };
  });
}

function sendText() {
  const txt = $('msgInp').value.trim();
  if (!txt) return;
  if (!state.mqtt || !state.currentChat) return;

  const msg = {
    id: uid(),
    from: state.myName,
    fromId: state.myId,
    time: Date.now(),
    type: 'text',
    text: txt,
  };

  if (state.currentChat.type === 'group') {
    msg.groupId = state.currentChat.groupId;
    const g = state.groups[state.currentChat.groupId];
    for (const m of g.members) {
      if (m === state.myId) continue;
      state.mqtt.publish(`${PREFIX}/msg/${m}`, JSON.stringify(msg));
    }
  } else {
    state.mqtt.publish(`${PREFIX}/msg/${state.currentChat.peerId}`, JSON.stringify(msg));
  }

  if (!state.messages[state.currentChat.id]) state.messages[state.currentChat.id] = [];
  state.messages[state.currentChat.id].push(msg);
  save();
  appendMessage(msg, true);

  $('msgInp').value = '';
  updateSendMic();
  sendTyping(false);
}

function sendTyping(t) {
  if (!state.mqtt || !state.currentChat) return;
  const payload = JSON.stringify({ fromId: state.myId, from: state.myName, typing: t });
  if (state.currentChat.type === 'group') {
    const g = state.groups[state.currentChat.groupId];
    for (const m of g.members) {
      if (m === state.myId) continue;
      state.mqtt.publish(`${PREFIX}/typing/${m}`, payload);
    }
  } else {
    state.mqtt.publish(`${PREFIX}/typing/${state.currentChat.peerId}`, payload);
  }
}

function updateTypingBar() {
  const bar = $('typingBar');
  if (!state.currentChat) { bar.classList.remove('on'); bar.textContent = ''; return; }
  let typers = [];
  if (state.currentChat.type === 'group') {
    const g = state.groups[state.currentChat.groupId];
    typers = g.members.filter(m => m !== state.myId && state.typing[m])
      .map(m => state.contacts[m]?.name || 'کاربر');
  } else {
    if (state.typing[state.currentChat.peerId]) typers = [state.currentChat.name];
  }
  if (!typers.length) { bar.classList.remove('on'); bar.textContent = ''; }
  else if (typers.length === 1) { bar.classList.add('on'); bar.textContent = `✎ ${typers[0]} داره تایپ می‌کنه...`; }
  else { bar.classList.add('on'); bar.textContent = `✎ ${typers.length} نفر دارن تایپ می‌کنن...`; }
}

// ============ Voice Recording ============
let recorder = null, recChunks = [], recSec = 0, recTmr = null;

$('micBtn').onclick = async () => {
  if (recorder) { stopRec(true); return; }

  const isSecure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (!isSecure) { alert('❌ میکروفون فقط روی HTTPS کار می‌کنه!'); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { alert('❌ مرورگرت پشتیبانی نمی‌کنه.'); return; }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recChunks = [];
    const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
    recorder = new MediaRecorder(stream, { mimeType: mime });
    recorder.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
    recorder.start(100);
    recSec = 0;
    $('recTime').textContent = '00:00';
    $('recBar').classList.add('on');
    $('micBtn').classList.add('rec');
    $('micBtn').textContent = '⏹';

    recTmr = setInterval(() => {
      recSec++;
      $('recTime').textContent = fmtDur(recSec);
      if (recSec >= MAX_VOICE_DURATION) stopRec(true);
    }, 1000);
  } catch(e) {
    console.error('mic error:', e);
    if (e.name === 'NotAllowedError') alert('❌ اجازه میکروفون داده نشد!\n\nروی قفل 🔒 کنار آدرس بزن → Microphone → Allow');
    else alert('❌ خطا: ' + e.message);
  }
};

function stopRec(sendIt) {
  if (!recorder) return;
  clearInterval(recTmr);
  const dur = recSec;
  const r = recorder;
  r.onstop = async () => {
    r.stream.getTracks().forEach(t => t.stop());
    recorder = null;
    $('recBar').classList.remove('on');
    $('micBtn').classList.remove('rec');
    $('micBtn').textContent = '🎤';
    if (sendIt && recChunks.length) {
      const blob = new Blob(recChunks, { type: 'audio/webm' });
      recChunks = [];
      if (blob.size > 100) await sendVoice(blob, dur);
    } else recChunks = [];
  };
  r.stop();
}

$('cancelRec').onclick = () => stopRec(false);
$('sendRec').onclick = () => stopRec(true);

// ============ Send Voice ============
async function sendVoice(blob, duration) {
  if (!state.currentChat || !state.mqtt) return;
  console.log('🎤 ویس ضبط شد:', blob.size, 'بایت /', duration, 'ثانیه');

  if (blob.size > MAX_VOICE_SIZE) {
    alert('❌ ویس خیلی بزرگه! (' + Math.round(blob.size/1024) + 'KB)\n\nحداکثر ۲۰۰ کیلوبایت — یعنی حدود ۱۵ ثانیه.');
    return;
  }

  const fileId = 'f_' + uid();
  const msgId = uid();
  state.fileStore[fileId] = { blob, name: 'voice.webm', size: blob.size, mime: 'audio/webm', duration };

  let base64;
  try {
    base64 = await blobToBase64(blob);
    console.log('🔄 base64:', base64.length, 'کاراکتر');
  } catch(e) { alert('خطا در پردازش ویس'); return; }

  const msg = {
    id: msgId, from: state.myName, fromId: state.myId,
    time: Date.now(), type: 'voice', fileId, duration,
    audioBase64: base64, mime: 'audio/webm',
  };

  if (state.currentChat.type === 'group') {
    msg.groupId = state.currentChat.groupId;
    const g = state.groups[state.currentChat.groupId];
    for (const m of g.members) {
      if (m === state.myId) continue;
      state.mqtt.publish(`${PREFIX}/msg/${m}`, JSON.stringify(msg));
    }
  } else {
    state.mqtt.publish(`${PREFIX}/msg/${state.currentChat.peerId}`, JSON.stringify(msg));
  }

  const localMsg = { ...msg };
  delete localMsg.audioBase64;
  if (!state.messages[state.currentChat.id]) state.messages[state.currentChat.id] = [];
  state.messages[state.currentChat.id].push(localMsg);
  save();
  appendMessage(localMsg, true);
  console.log('✅ ویس ارسال شد');
}

// ============ Handle Image Pick ============
async function handleImagePick(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { alert('فقط عکس قبول می‌شه!'); return; }

  $('uploading').classList.add('on');

  try {
    // فشرده‌سازی
    const compressed = await compressImage(file, 800, 0.6);
    console.log('📷 عکس فشرده:', Math.round(compressed.size/1024), 'KB');

    if (compressed.size > MAX_IMAGE_SIZE) {
      alert('❌ عکس حتی بعد از فشرده‌سازی بزرگه (' + Math.round(compressed.size/1024) + 'KB)\n\nعکس کوچیک‌تر انتخاب کن.');
      $('uploading').classList.remove('on');
      return;
    }

    await sendImage(compressed);
  } catch(err) {
    console.error(err);
    alert('خطا در پردازش عکس');
  }
  $('uploading').classList.remove('on');
}

// ============ Voice Playback ============
let curAudio = null, curVB = null;

function playVoice(fileId, vb) {
  const fs = state.fileStore[fileId];
  if (!fs) { alert('❌ فایل صوتی در حافظه نیست'); return; }

  if (curAudio && curVB === vb && !curAudio.paused) {
    curAudio.pause();
    vb.classList.remove('playing');
    vb.querySelector('.play').textContent = '▶';
    curAudio = null; curVB = null;
    return;
  }

  if (curAudio) {
    curAudio.pause();
    document.querySelectorAll('.voiceBox.playing').forEach(b => {
      b.classList.remove('playing');
      b.querySelector('.play').textContent = '▶';
    });
  }

  try {
    const url = URL.createObjectURL(fs.blob);
    curAudio = new Audio(url);
    curVB = vb;
    curAudio.play();
    vb.classList.add('playing');
    vb.querySelector('.play').textContent = '⏸';

    curAudio.onended = () => {
      vb.classList.remove('playing');
      vb.querySelector('.play').textContent = '▶';
      URL.revokeObjectURL(url);
      curAudio = null; curVB = null;
    };
    curAudio.onerror = (e) => {
      console.error('play error:', e);
      vb.classList.remove('playing');
      vb.querySelector('.play').textContent = '▶';
      curAudio = null; curVB = null;
    };
  } catch(e) { console.error(e); }
}

// ============ Groups ============
$('newGroupFab').onclick = () => {
  $('groupNameInp').value = '';

  openModal('newGroupModal');
};

function renderContactPickList() {
  const box = $('contactPickList');
  box.innerHTML = '';
  const list = Object.entries(state.contacts);
  if (!list.length) {
    box.innerHTML = '<div style="color:#8696a0;font-size:13px;padding:12px;text-align:center">هنوز مخاطبی نداری</div>';
    return;
  }
  for (const [uid2, c] of list) {
    const row = document.createElement('label');
    row.className = 'contact-row';
    row.innerHTML = `
      <input type="checkbox" value="${uid2}">
      <div class="av" style="background:${colorOf(c.name)}">${esc(c.name[0].toUpperCase())}</div>
      <div style="flex:1;min-width:0">
        <div class="nm">${esc(c.name)}</div>
        <div class="uid" dir="ltr">${esc(uid2)}</div>
      </div>`;
    row.querySelector('input').onchange = updateCreateGroupBtn;
    box.appendChild(row);
  }
  updateCreateGroupBtn();
}

$('groupNameInp').addEventListener('input', updateCreateGroupBtn);
function updateCreateGroupBtn() {
  const n = $('groupNameInp').value.trim();
  const cnt = document.querySelectorAll('#contactPickList input:checked').length;
  $('createGroupOk').disabled = !(n && cnt > 0);
}

$('createGroupOk').onclick = () => {
  const name = $('groupNameInp').value.trim();
  const selected = Array.from(document.querySelectorAll('#contactPickList input:checked')).map(cb => cb.value);
  if (!name || !selected.length) return;
  const gid = uid();
  const members = [state.myId, ...selected];
  state.groups[gid] = { name, members, createdAt: Date.now() };
  save();

  const invite = { type: 'invite', groupId: gid, groupName: name, members, from: state.myName, fromId: state.myId };
  for (const m of selected) {
    state.mqtt.publish(`${PREFIX}/msg/${m}`, JSON.stringify(invite));
  }
  closeModal('newGroupModal');
  renderChatList();
  openChat({ id: 'group_' + gid, type: 'group', groupId: gid, name });
};
